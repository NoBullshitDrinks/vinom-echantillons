<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PARDELA · Échantillons GDD2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--acc:#6d2144;--acc2:#9c3a63;--ink:#1c2530;--muted:#6b7683;--bg:#f1edef;--card:#fff;--line:#e2d8dd;
 --ok:#2e7d54;--warn:#b45309;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:30;background:var(--acc);color:#fff;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand b{font-size:16px;letter-spacing:.5px}.brand small{opacity:.85;font-size:12px}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--acc);text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px;font-weight:600}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
.field input:focus{outline:2px solid var(--acc2);outline-offset:1px}
.field.full{grid-column:1 / -1}
.needsel{border-color:var(--warn)!important;background:#fff8ef}
.addbtn{margin-top:12px;width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.setup input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.setup label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px;font-weight:600}
.list h2{font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.4px;margin:6px 2px 10px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .info{flex:1;min-width:0}
.item .t{font-weight:700;font-size:14.5px}
.item .s{font-size:12px;color:var(--muted);margin-top:2px}
.item .q{font-weight:700;color:var(--acc);font-size:15px;white-space:nowrap}
.item button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 12px rgba(0,0,0,.08);padding:10px 14px}
.bottom .inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tot{font-size:13px;color:var(--muted)}.tot b{font-size:20px;color:var(--ink);display:block;line-height:1}
.btn-validate{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer}
.btn-validate:disabled{background:#c3b2ba;cursor:not-allowed}
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:94%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,20,25,.5)}
.dlg{padding:20px}.dlg h2{margin:0 0 4px;font-size:18px;color:var(--acc)}.dlg p{margin:6px 0;font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#f6eef2;color:var(--acc);font-size:12px}
.row{display:flex;gap:8px;margin-top:14px}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn-ghost{background:#fff;border:1px solid var(--acc);color:var(--acc)}.btn-acc{background:var(--acc);color:#fff}
.ok-ico{width:52px;height:52px;border-radius:50%;background:#e7f4ec;color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 8px}
.spin{width:44px;height:44px;border:4px solid #e6d7de;border-top-color:var(--acc);border-radius:50%;margin:6px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="brand"><div><b>PARDELA · Échantillons GDD2</b><br><small>Relevé mensuel des échantillons — vins PARDELA stockés à GDD2</small></div></div></header>
<div class="wrap">
  <div class="setup">
    <div><label for="nom">Ton nom</label><input id="nom" value="Alexandre Moncel"></div>
    <div><label for="mois">Mois du relevé</label><input type="month" id="mois"></div>
  </div>

  <div class="card">
    <h2>Ajouter un échantillon prélevé</h2>
    <div class="grid">
      <div class="field full"><label>Pays / Région *</label><input id="f_reg" placeholder="Ex. : France – Bourgogne  /  Espagne – Rioja"></div>
      <div class="field"><label>Domaine *</label><input id="f_dom" placeholder="Ex. : Domaine Untel"></div>
      <div class="field"><label>Référence / Cuvée *</label><input id="f_ref" placeholder="Ex. : Les Terrasses"></div>
      <div class="field"><label>Millésime</label><input id="f_mil" placeholder="Ex. : 2022" inputmode="numeric"></div>
      <div class="field"><label>Quantité (bouteilles) *</label><input id="f_qte" type="number" min="1" value="1"></div>
    </div>
    <button class="addbtn" id="add">+ Ajouter à la liste</button>
  </div>

  <div class="list">
    <h2>Échantillons du mois</h2>
    <div id="items"></div>
  </div>
</div>

<div class="bottom"><div class="inner">
  <div class="tot"><b id="totbt">0</b> bouteille(s) · <span id="totref">0</span> ligne(s)</div>
  <button class="btn-validate" id="validate" disabled>Valider et vérifier</button>
</div></div>

<dialog id="dlgCheck"><div class="dlg">
  <h2>Vérifie ton relevé</h2>
  <p id="chk_sub"></p>
  <div style="max-height:50vh;overflow:auto"><table id="chk_tbl"></table></div>
  <div class="row">
    <button class="btn btn-ghost" id="chk_back" style="flex:1">Continuer la saisie</button>
    <button class="btn btn-acc" id="chk_send" style="flex:1">Confirmer et envoyer</button>
  </div>
</div></dialog>
<dialog id="dlgSend"><div class="dlg" style="text-align:center"><div class="spin"></div><p>Envoi du relevé…</p></div></dialog>
<dialog id="dlgOK"><div class="dlg" style="text-align:center">
  <div class="ok-ico">✓</div><h2 id="ok_title">Relevé envoyé</h2><p id="ok_msg"></p>
  <div class="row" style="flex-direction:column" id="ok_actions"></div>
</div></dialog>

<script>
const CONFIG = {
  ENTITE: "PARDELA",
  WEBHOOK_URL: "https://echantillons-worker.lecoindalex.workers.dev/submit",
  MAIL_TO: "adv@vinom.fr",
  MAIL_CC: "alexandremoncel@gmail.com"
};
const CENTRAL = !!CONFIG.WEBHOOK_URL;
const $=s=>document.querySelector(s);
let items=[];   // {reg,dom,ref,mil,qte}

$("#mois").value=new Date().toISOString().slice(0,7);
function draftKey(){return "pardela_ech_"+$("#mois").value;}
function save(){try{localStorage.setItem(draftKey(),JSON.stringify(items));}catch(e){}}
function load(){try{items=JSON.parse(localStorage.getItem(draftKey())||"[]");}catch(e){items=[];}}
$("#mois").onchange=()=>{load();render();};

function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(){
  const box=$("#items");box.innerHTML="";
  if(!items.length){box.innerHTML='<div class="empty">Aucun échantillon pour l\'instant.<br>Ajoute un vin avec le formulaire ci-dessus.</div>';}
  items.forEach((it,i)=>{
    const el=document.createElement("div");el.className="item";
    el.innerHTML=`<div class="info"><div class="t">${esc(it.dom)} — ${esc(it.ref)}${it.mil?" ("+esc(it.mil)+")":""}</div>
      <div class="s">${esc(it.reg)}</div></div><div class="q">${it.qte} bt</div>`;
    const b=document.createElement("button");b.textContent="Retirer";
    b.onclick=()=>{items.splice(i,1);save();render();};
    el.appendChild(b);box.appendChild(el);
  });
  const bt=items.reduce((s,x)=>s+x.qte,0);
  $("#totbt").textContent=bt;$("#totref").textContent=items.length;
  $("#validate").disabled=!items.length;
}
function need(id){const el=$(id);el.classList.add("needsel");el.focus();setTimeout(()=>el.classList.remove("needsel"),1500);}
$("#add").onclick=()=>{
  const reg=$("#f_reg").value.trim(),dom=$("#f_dom").value.trim(),ref=$("#f_ref").value.trim(),
        mil=$("#f_mil").value.trim(),qte=parseInt($("#f_qte").value||"0",10);
  if(!reg)return need("#f_reg"); if(!dom)return need("#f_dom"); if(!ref)return need("#f_ref");
  if(!qte||qte<1)return need("#f_qte");
  items.push({reg,dom,ref,mil,qte});save();render();
  $("#f_reg").value="";$("#f_dom").value="";$("#f_ref").value="";$("#f_mil").value="";$("#f_qte").value=1;$("#f_reg").focus();
};

$("#validate").onclick=()=>{
  const bt=items.reduce((s,x)=>s+x.qte,0);
  $("#chk_sub").textContent=`${bt} bouteille(s) sur ${items.length} ligne(s) — vérifie avant d'envoyer.`;
  let h="<tr><th>Pays / Région</th><th>Domaine</th><th>Référence</th><th>Mill.</th><th>Qté</th></tr>";
  items.forEach(it=>h+=`<tr><td>${esc(it.reg)}</td><td>${esc(it.dom)}</td><td>${esc(it.ref)}</td><td>${esc(it.mil)}</td><td>${it.qte}</td></tr>`);
  $("#chk_tbl").innerHTML=h;$("#dlgCheck").showModal();
};
$("#chk_back").onclick=()=>$("#dlgCheck").close();
$("#chk_send").onclick=async()=>{
  $("#dlgCheck").close();
  const nom=$("#nom").value.trim()||"Alexandre Moncel",mois=$("#mois").value;
  const lines=items.map(it=>({mois,entite:CONFIG.ENTITE,agent:"PARDELA",agentNom:nom,region:it.reg,
    nf:"",four:it.dom,code:it.ref,millesime:it.mil,article:(it.ref+(it.mil?" "+it.mil:"")).trim(),coul:"",qte:it.qte,horsTarif:false}));
  if(CENTRAL){
    $("#dlgSend").showModal();let ok=false;
    try{const r=await fetch(CONFIG.WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mois,entite:CONFIG.ENTITE,agent:"PARDELA",agentNom:nom,date:new Date().toISOString(),lines})});ok=r.ok;}catch(e){ok=false;}
    $("#dlgSend").close();
    if(ok){clearDraft();showSent(mois);return;}
    download(lines,mois);showFallback(mois);return;
  }
  download(lines,mois);clearDraft();showAutonome(mois);
};
function clearDraft(){try{localStorage.removeItem(draftKey());}catch(e){}}
function download(lines,mois){
  const rows=lines.map(l=>({"Mois":l.mois,"Entité":"PARDELA","Pays / Région":l.region,"Domaine":l.four,
    "Référence":l.code,"Millésime":l.millesime,"Qté prélevée":l.qte,"Saisi par":l.agentNom}));
  const fname="Echantillons_PARDELA_"+mois+".xlsx";
  if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=[{wch:8},{wch:9},{wch:26},{wch:26},{wch:26},{wch:9},{wch:12},{wch:20}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"PARDELA");XLSX.writeFile(wb,fname);}
  else{const head=Object.keys(rows[0]);const csv=[head.join(";")].concat(rows.map(r=>head.map(h=>'"'+String(r[h]).replace(/"/g,'""')+'"').join(";"))).join("\n");
    const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname.replace(".xlsx",".csv");a.click();}
}
function resetAll(){items=[];render();}
function showSent(mois){$("#ok_title").textContent="Relevé envoyé ✓";
  $("#ok_msg").textContent="Yasmina et Alexandre recevront le fichier consolidé PARDELA en début de mois prochain. Rien d'autre à faire.";
  $("#ok_actions").innerHTML="";addBtn("Nouveau relevé","btn-acc",()=>{resetAll();$("#dlgOK").close();});$("#dlgOK").showModal();}
function showAutonome(mois){$("#ok_title").textContent="Relevé prêt";
  $("#ok_msg").textContent="Fichier PARDELA téléchargé. Envoie-le à Yasmina et Alexandre.";
  $("#ok_actions").innerHTML="";addBtn("Envoyer par e-mail","btn-acc",()=>mailTo(mois));addBtn("Nouveau relevé","btn-ghost",()=>{resetAll();$("#dlgOK").close();});$("#dlgOK").showModal();}
function showFallback(mois){$("#ok_title").textContent="Serveur injoignable";
  $("#ok_msg").textContent="Le relevé n'a pas pu être envoyé (réseau ?). Le fichier a été téléchargé : envoie-le à Yasmina et Alexandre, ou revalide plus tard.";
  $("#ok_actions").innerHTML="";addBtn("Envoyer par e-mail","btn-acc",()=>mailTo(mois));addBtn("Fermer","btn-ghost",()=>$("#dlgOK").close());$("#dlgOK").showModal();}
function addBtn(t,c,fn){const b=document.createElement("button");b.className="btn "+c;b.style.width="100%";b.textContent=t;b.onclick=fn;$("#ok_actions").appendChild(b);}
function mailTo(mois){const bt=items.reduce((s,x)=>s+x.qte,0);
  const s=encodeURIComponent("Échantillons PARDELA – "+mois);
  const b=encodeURIComponent("Bonjour,\n\nCi-joint le relevé des échantillons PARDELA prélevés à GDD2 ("+bt+" bouteilles).\nMerci de réclamer les avoirs.\n\n(Ne pas oublier de joindre le fichier téléchargé.)\n\n"+($("#nom").value||"Alexandre Moncel"));
  location.href="mailto:"+CONFIG.MAIL_TO+"?cc="+CONFIG.MAIL_CC+"&subject="+s+"&body="+b;}

load();render();
</script>
</body>
</html>
